name: changelog

# The /changelog page is built from CHANGELOG.md alone (scripts/build-changelog.py: no git history, no GitHub, no
# network). This job proves CHANGELOG.md is plain (titles, places, no banned words), that the committed snapshot
# resources/changelog.json is what the builder makes from it, and that the builder's own tests pass.
on:
  pull_request:
    branches: [main]
    paths:
      - CHANGELOG.md
      - scripts/build-changelog.py
      - scripts/test_build_changelog.py
      - app/Http/Controllers/ChangelogController.php
      - resources/changelog.json
      - .github/workflows/changelog.yml

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Changelog is plain and current
        run: python3 scripts/build-changelog.py --repo LinkHop --check && python3 -m unittest scripts/test_build_changelog.py
