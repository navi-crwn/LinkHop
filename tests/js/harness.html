<!doctype html>
<meta charset="utf-8">
<title>QR decode harness</title>
<script src="/public/vendor/qr-code-styling/qr-code-styling.js"></script>
<script type="module">
  import { qrStyleOptions } from '/resources/js/qr/options.js';
  // Renders `data` with the vendored qr-code-styling and returns the PNG as base64.
  // opts: { size, fg, bg, ecc, dots, corners, cornerDots, logoDataUrl, logoSize, binary: false for the control }
  window.renderPng = async function (data, opts) {
    opts = opts || {};
    var size = opts.size || 512;
    // The same option builder as the page (studio.js); only what a case overrides is changed afterwards.
    var style = { fg: opts.fg || '#000000', bg: opts.bg || '#ffffff', dots: opts.dots || 'square', corners: opts.corners || 'square',
      logo: opts.logoDataUrl || '', logoSize: Math.round((opts.logoSize || 0.25) * 100) };
    var o = qrStyleOptions(style, 'canvas', size, data, opts.margin == null ? Math.round(size * 0.09) : opts.margin);
    if (opts.ecc) o.qrOptions.errorCorrectionLevel = opts.ecc;
    if (opts.cornerDots) o.cornersDotOptions.type = opts.cornerDots;
    if (opts.binary === false) o.data = data; // control only: the library fed the raw string
    var qr = new QRCodeStyling(o);
    var blob = await qr.getRawData('png');
    var modules = qr._qr && qr._qr.getModuleCount ? qr._qr.getModuleCount() : null;
    var b64 = await new Promise(function (res) {
      var fr = new FileReader();
      fr.onload = function () { res(String(fr.result).split(',')[1]); };
      fr.readAsDataURL(blob);
    });
    return { b64: b64, modules: modules };
  };
  window.ready = true;
</script>
