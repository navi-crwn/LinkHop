<!doctype html>
<meta charset="utf-8">
<title>QR decode harness</title>
<script src="/public/vendor/qr-code-styling/qr-code-styling.js"></script>
<script type="module">
  import * as QrPayloads from '/resources/js/qr/payloads.js';
  // Renders `data` with the vendored qr-code-styling and returns the PNG as base64.
  // opts: { size, fg, bg, ecc, dots, corners, cornerDots, logoDataUrl, logoSize, binary }
  window.renderPng = async function (data, opts) {
    opts = opts || {};
    var size = opts.size || 512;
    var qr = new QRCodeStyling({
      width: size, height: size, type: 'canvas',
      data: opts.binary ? QrPayloads.binaryString(data) : data,
      margin: opts.margin == null ? Math.round(size * 0.09) : opts.margin,
      qrOptions: { errorCorrectionLevel: opts.ecc || 'M' },
      dotsOptions: { color: opts.fg || '#000000', type: opts.dots || 'square' },
      backgroundOptions: { color: opts.bg || '#ffffff' },
      cornersSquareOptions: { color: opts.fg || '#000000', type: opts.corners || 'square' },
      cornersDotOptions: { color: opts.fg || '#000000', type: opts.cornerDots || 'square' },
      image: opts.logoDataUrl || undefined,
      imageOptions: { imageSize: opts.logoSize || 0.25, margin: 2, hideBackgroundDots: true, crossOrigin: 'anonymous' }
    });
    var blob = await qr.getRawData('png');
    var modules = qr._qr && qr._qr.getModuleCount ? qr._qr.getModuleCount() : null;
    var b64 = await new Promise(function (res) {
      var fr = new FileReader();
      fr.onload = function () { res(String(fr.result).split(',')[1]); };
      fr.readAsDataURL(blob);
    });
    return { b64: b64, modules: modules };
  };
  window.ready = true;
</script>
