faq_h = Häufig gestellte Fragen
q1 = Was ist aus den Link-in-Bio-Seiten geworden?
a1 = Bio-Seiten sind zu BioHop (bio.hel.ink) umgezogen, einer eigenen, funktionsreichen App. Bestehende Bio-Links leiten nahtlos weiter.
q2 = Kann ich eigene Kurznamen verwenden?
a2 = Ja, angemeldete Nutzer können für jeden Link einen eigenen Kurznamen wählen, solange er frei und erlaubt ist.
q3 = Wie schützt das Klick-Tracking die Privatsphäre?
a3 = Klicks werden zusammengefasst, ohne rohe personenbezogene Daten zu speichern oder Nutzerprofile zu verkaufen, und Protokolle werden regelmäßig gelöscht.
q4 = Ist LinkHop kostenlos und Open Source?
a4 = Ja, LinkHop steht unter der freizügigen MIT-Lizenz und kann von allen genutzt und selbst gehostet werden.
