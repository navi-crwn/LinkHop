faq_h = Частые вопросы
q1 = Что стало со страницами «ссылки в профиле»?
a1 = Страницы-визитки переехали в BioHop (bio.hel.ink) — отдельное приложение с широкими возможностями. Существующие ссылки перенаправляются без перебоев.
q2 = Можно ли задавать свои короткие адреса?
a2 = Да, авторизованные пользователи могут выбрать свой адрес для любой ссылки, если он свободен и допустим.
q3 = Как учёт кликов защищает приватность?
a3 = Клики агрегируются без хранения необработанных персональных данных и без продажи профилей, а журналы регулярно очищаются.
q4 = LinkHop бесплатный и с открытым кодом?
a4 = Да, LinkHop выпускается по свободной лицензии MIT: пользуйтесь и разворачивайте у себя.
