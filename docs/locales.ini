[en]
dir = ltr
page_title = LinkHop · Short links, QR codes & click analytics
page_desc = Fast, privacy-respecting link shortener with custom slugs, QR codes, deep analytics, and threat scanning. Part of the HOP family.
og_title = LinkHop · HOP Link Shortener
skip = Skip to main content
nav_label = Main navigation
nav_features = Features
