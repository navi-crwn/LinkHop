f3_t = Подробная аналитика кликов
f3_d = Следите за странами посетителей (GeoIP), устройствами, браузерами, операционными системами и источниками переходов в реальном времени.
f4_t = Автоматическая защита от угроз
f4_d = Упреждающая проверка с hop/safety и общими чёрными списками доменов защищает вашу аудиторию.
