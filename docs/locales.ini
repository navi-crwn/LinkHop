theme_btn_dark = Dark
kicker = The HOP Shortener
h1 = Short links, QR codes, and click analytics.
lede = Shorten links, count every click, analyze your visitors by country and device, and protect them with automated threat detection.
cta_main = Open Dashboard
cta_demo = Try a short link
cta_code = View on GitHub
hero_note = Free and open source under the MIT license. Looking for bio pages? Check out BioHop.
features_h = Features
f1_t = Lightning-Fast Shortening
f1_d = Custom memorable slugs or random IDs served instantly at hel.ink/l/{slug} with low-latency redirects.
f2_t = Dynamic QR Codes
f2_d = Generate high-resolution SVG/PNG QR codes for print, packaging, and digital sharing.
f3_t = Deep Click Analytics
f3_d = Track visitor countries (GeoIP), devices, browsers, operating systems, and referrers in real time.
f4_t = Automated Threat Safety
f4_d = Proactive scanning via hop/safety and shared domain blacklists to safeguard your audience.
f5_t = Granular Link Controls
f5_d = Set expiration dates, maximum click counts, and password protection for sensitive destinations.
f6_t = Organization & Tags
f6_d = Group links into folders and tag campaigns for clean team management and aggregated reports.
f7_t = HOP ID Single Sign-On
f7_d = Sign in once with your central HOP ID; no duplicate accounts or fragmented sessions.
f8_t = Developer REST API
f8_d = Full API with scoped token authentication to programmatically create and monitor links.
run_h = Run your own LinkHop
run_intro = LinkHop runs on standard modern PHP and Laravel infrastructure.
run_req_h = Prerequisites
run_req = PHP 8.3+, Composer, Node.js 22+, and SQLite or MySQL/MariaDB.
run_sso_h = Single Sign-On Setup
run_sso = Configure HOP_HUB_URL, HOP_APP=linkhop, and HOP_SSO_SECRET to authenticate users against your HOP ID hub.
run_db_h = Shared Database Support
run_db = LinkHop can share a database with the hub and BioHop; its migrations are tracked in migrations_linkhop.
run_note = See .env.example for comprehensive configuration keys and comments.
faq_h = Frequently asked questions
q1 = What happened to link-in-bio pages?
a1 = Bio pages have moved to BioHop (bio.hel.ink) as a dedicated, feature-rich app. Existing bio links redirect seamlessly.
q2 = Can I use custom slugs?
a2 = Yes, authenticated users can pick custom slugs for any link as long as they are available and allowed.
q3 = How does click tracking protect privacy?
a3 = Clicks are aggregated without storing raw personal data or selling user profiles, and logs are routinely pruned.
q4 = Is LinkHop free and open source?
a4 = Yes, LinkHop is released under the permissive MIT license for everyone to use and self-host.
